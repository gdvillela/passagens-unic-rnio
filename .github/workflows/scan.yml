name: busca-unicornio
on:
  schedule:
    - cron: "0 10 * * *"   # 7h (horário de Brasília), 1x ao dia
  workflow_dispatch:             # botão "Run workflow" para rodar na hora
permissions:
  contents: write
concurrency: busca-unicornio
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Buscar passagens
        run: python -m unicornio scan --origens SAO,RIO,BSB --meses 6 --db dados/precos.db --saida dados/relatorio
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DUFFEL_TOKEN: ${{ secrets.DUFFEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar histórico e relatório no repositório
        if: always()
        run: |
          git config user.name "busca-unicornio"
          git config user.email "actions@users.noreply.github.com"
          git add dados/
          git diff --cached --quiet || git commit -m "Busca $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
